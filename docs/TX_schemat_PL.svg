<rect x="750" y="380" width="240" height="240" rx="8" fill="#fbfcfd" stroke="#cfd6df"/>
<text x="764" y="404" font-size="13.5" font-weight="700" fill="#1c2530">Piny ESP32 (wg kodu)</text>
<text x="764" y="426" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1c2530">GPIO5  → TRIG (czujnik)</text>
<text x="764" y="445" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1c2530">GPIO18 ← ECHO (przez dzielnik)</text>
<text x="764" y="464" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1c2530">GPIO23 → bramka MOSFET (przez R1)</text>
<text x="764" y="483" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1c2530">5V/VIN ← 5 V z BMS</text>
<text x="764" y="502" font-size="12" font-family="Consolas, Menlo, monospace" fill="#1c2530">GND    → wspólna masa</text>
<text x="764" y="540" font-size="13.5" font-weight="700" fill="#1c2530">Uwagi</text>
<text x="764" y="560" font-size="11" fill="#5f6b7a">Dzielnik ECHO: 5 V × 2/3 = 3,33 V</text>
<text x="764" y="576" font-size="11" fill="#5f6b7a">IRLZ44N: klucz w masie czujnika</text>
<text x="764" y="592" font-size="11" fill="#5f6b7a">R2: czujnik wyłączony w deep sleep</text>
<text x="764" y="608" font-size="11" fill="#5f6b7a">Czujnik zasilany tylko podczas pomiaru</text>
