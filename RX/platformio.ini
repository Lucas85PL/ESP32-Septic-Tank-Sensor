; PlatformIO Project Configuration File
; RX 2.0.0 - ESP32E 2.8" (E32R28T): ILI9341 240x320 + dotyk rezystancyjny XPT2046
; Wersja pod ST7735S (v0.8.9): backup_ST7735_v0.8.9/ w poprzednim projekcie (nie skopiowany)

[env:esp32dev]
; Wersje przypiete (zweryfikowany build). Zmieniaj swiadomo - nowe wydanie moze zmienic Wi-Fi/ESP-NOW/LittleFS/grafike.
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit BusIO@1.17.4
	adafruit/Adafruit ILI9341@1.6.4
