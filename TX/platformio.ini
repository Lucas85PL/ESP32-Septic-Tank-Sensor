; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Wersja platformy przypieta (zweryfikowany build). Zmieniaj swiadomo - nowe wydanie moze zmienic Wi-Fi/ESP-NOW/LittleFS.
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200
board_build.partitions = partitions/logger_512k.csv
board_build.filesystem = littlefs
